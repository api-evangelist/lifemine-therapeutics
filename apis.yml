aid: lifemine-therapeutics
name: LifeMine Therapeutics
description: 'LifeMine Therapeutics is a clinical-stage biopharmaceutical company headquartered
  in Watertown, Massachusetts, with sites in Gloucester, Massachusetts and Basel, Switzerland.
  It pioneers a Top-Down Drug Discovery approach that leverages evolutionary insights from
  fungi to find next-generation precision medicines. Its LifeBank collection of deep-sequenced
  wild-type fungi and its Avatar-Rx platform combine human genetics and genomics, bioinformatics,
  machine learning and synthetic biology to mine biosynthetic gene clusters for genetically
  encoded small molecules, using embedded target genes as avatars to predict therapeutic
  effect independent of chemical structure. Its lead program LIFE-001 is a precision-engineered
  calcineurin inhibitor in Phase 1 for immune-mediated disorders and organ transplant rejection,
  alongside a genomic drug discovery alliance with GSK. LifeMine publishes no public API,
  developer portal, or machine-readable API specification.'
